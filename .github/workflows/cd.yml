name: CD - Deploy to Docker Hub

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create .env for backend
        run: |
          echo "APP_SECRET_NAME=${{ secrets.APP_SECRET_NAME }}" > ./backend/.env

      - name: Build & push backend image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/ci-cd-testing-deploy:backend ./backend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/ci-cd-testing-deploy:backend

      - name: Build & push frontend image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/ci-cd-testing-deploy:frontend ./frontend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/ci-cd-testing-deploy:frontend